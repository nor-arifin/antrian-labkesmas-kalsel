version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./public/audio:/app/public/audio
      - ./public/videos:/app/public/videos
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/antrian.db
      - CLINIC_NAME=LABORATORIUM KESEHATAN PROVINSI KALIMANTAN SELATAN
      - RESET_HOUR=23
      - TZ=Asia/Pontianak
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antrian.rule=Host(`antrian.labklin.net`)"
      - "traefik.http.routers.antrian.entrypoints=websecure"
      - "traefik.http.routers.antrian.tls.certresolver=letsencrypt"
      - "traefik.http.services.antrian.loadbalancer.server.port=3001"
    restart: unless-stopped

networks:
  dokploy-network:
    name: dokploy-network
    external: true
