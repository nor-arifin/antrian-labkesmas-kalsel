version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./public/audio:/app/public/audio
      - ./public/videos:/app/public/videos
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/antrian.db
      - CLINIC_NAME=LABORATORIUM KESEHATAN PROVINSI KALIMANTAN SELATAN
      - RESET_HOUR=23
      - TZ=Asia/Pontianak
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antrian-api.rule=Host(`antrian.labklin.net`) && PathPrefix(`/api`)"
      - "traefik.http.routers.antrian-api.entrypoints=websecure"
      - "traefik.http.routers.antrian-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.antrian-api.loadbalancer.server.port=3001"
      - "traefik.http.routers.antrian-socket.rule=Host(`antrian.labklin.net`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.antrian-socket.entrypoints=websecure"
      - "traefik.http.routers.antrian-socket.tls.certresolver=letsencrypt"
      - "traefik.http.services.antrian-socket.loadbalancer.server.port=3001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx-dokploy.conf:/etc/nginx/nginx.conf:ro
      - ./public/audio:/app/public/audio:ro
      - ./public/logo:/app/public/logo:ro
      - ./public/videos:/app/public/videos:ro
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.antrian.rule=Host(`antrian.labklin.net`)"
      - "traefik.http.routers.antrian.entrypoints=websecure"
      - "traefik.http.routers.antrian.tls.certresolver=letsencrypt"
      - "traefik.http.services.antrian.loadbalancer.server.port=80"
    restart: unless-stopped
    depends_on:
      - backend

networks:
  dokploy-network:
    name: dokploy-network
    external: true
