services:
  nginx:
    image: nginx:alpine
    ports:
      - "3080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./public/audio:/app/public/audio:ro
      - ./public/logo:/app/public/logo:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./public/audio:/app/public/audio
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/antrian.db
      - CLINIC_NAME=LABORATORIUM KESEHATAN PROVINSI KALIMANTAN SELATAN
      - RESET_HOUR=23
      - TZ=Asia/Pontianak
    restart: unless-stopped
